app:
  name: "template"
  port: 9000
  mode: "debug"
  defaultRootPass: "123456"
  timezone: "Asia/Shanghai"
  api_prefix: "/api/v1"
  static_path: "/static"
  upload_path: "uploads"
  max_upload_size: 10
  allowed_file_types:
    - "image/jpeg"
    - "image/png"
    - "image/gif"
    - "application/pdf"
    - "application/msword"
    - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"

frontend:
  web:
    enabled: true
    route_prefix: "/"
    title: "Web"
    description: "User frontend"
  fallback:
    enabled: false
    message: "Service unavailable"

database:
  driver: "mysql"
  host: "127.0.0.1"
  port: 3306
  username: "root"
  password: "password"
  name: "template_db"
  charset: "utf8mb4"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600
  slow_query_threshold: 200
  enable_logging: false
  table_prefix: ""

jwt:
  secret_key: "your-super-secret-key-change-this-in-production"
  expires_in: 24
  refresh_expires_in: 168
  issuer: "template-app"
  audience: "template-users"
  blacklist_enabled: true
  blacklist_cleanup_interval: 24

redis:
  host: ""
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5
  max_conn_age: 3600
  idle_timeout: 240
  read_timeout: 3
  write_timeout: 3
  dial_timeout: 5

log:
  level: "info"
  path: "logs"
  filename: "app.log"
  max_size: 100
  max_backups: 10
  max_age: 7
  compress: true
  json_format: false
  show_caller: false
  show_line: false
  show_stack: false
  enable_console: false

mail:
  host: "smtp.example.com"
  port: 465
  username: "your@example.com"
  password: "password"
  from: "your@example.com"
  from_name: "App"
  reply_to: "your@example.com"
  ssl: true
  enabled: false
  template_path: "templates/mail"
  max_retries: 3
  retry_interval: 5

cors:
  enabled: true
  allowed_origins:
    - "http://localhost:4000"
    - "https://yourdomain.com"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Origin"
    - "Content-Type"
    - "Authorization"
  allow_credentials: true
  max_age: 86400
  expose_headers:
    - "Content-Length"
    - "Content-Type"
