# Application config
app:
  name: "template"
  port: 8888
  mode: "debug"
  defaultRootPass: "123456"
  timezone: "Asia/Shanghai"

# Database config
database:
  driver: "mysql"
  host: "110.42.111.49"
  port: 1244
  username: "template"
  password: "R3DmF2eR"
  name: "template"
  charset: "utf8mb4"
  # Optional runtime overrides:
  # APP_DB_STRICT=true|false
  # APP_DB_AUTO_MIGRATE=true|false
  # APP_DB_BOOTSTRAP_ROOT=true|false

# JWT config
jwt:
  secret_key: "change-to-your-secure-secret-key"
  expires_in: 24
  refresh_expires_in: 168
  issuer: "template-app"
  audience: "template-users"
  blacklist_enabled: true

# Redis config
redis:
  enabled: false
  host: ""
  port: 6379
  password: ""
  db: 0

# Mail config
mail:
  host: "smtp.example.com"
  port: 465
  username: "your@example.com"
  password: "email-password"
  from: "your@example.com"
  from_name: "template"
  reply_to: "your@example.com"
  enabled: false

# CORS config
cors:
  enabled: true
  allowed_origins:
    - "http://localhost:3000"
    - "https://yourdomain.com"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Origin"
    - "Content-Type"
    - "Authorization"
  allow_credentials: true
  max_age: 86400
