app:
  name: "template"
  port: 7500
  mode: "release"
  defaultRootPass: "change-this-password"
  timezone: "Asia/Shanghai"
  api_prefix: "/api/v1"
  static_path: "/static"
  upload_path: "uploads"
  max_upload_size: 20
  allowed_file_types:
    - "image/jpeg"
    - "image/png"
    - "image/gif"
    - "application/pdf"
    - "application/msword"
    - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"

frontend:
  web:
    enabled: true
    route_prefix: "/"
    title: "Web"
    description: "User frontend"
  fallback:
    enabled: true
    message: "Service under maintenance"

database:
  driver: "mysql"
  host: "localhost"
  port: 3306
  username: "dbuser"
  password: "dbpassword"
  name: "template_db"
  charset: "utf8mb4"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600
  slow_query_threshold: 200
  enable_logging: false
  table_prefix: ""

jwt:
  secret_key: "change-to-your-secure-secret-key-min-32-chars"
  expires_in: 24
  refresh_expires_in: 168
  issuer: "template-app"
  audience: "template-users"
  blacklist_enabled: true
  blacklist_cleanup_interval: 24

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5
  max_conn_age: 3600
  idle_timeout: 240
  read_timeout: 3
  write_timeout: 3
  dial_timeout: 5

log:
  level: "info"
  path: "logs"
  filename: "app.log"
  max_size: 100
  max_backups: 10
  max_age: 7
  compress: true
  json_format: false
  show_caller: false
  show_line: false
  show_stack: false
  enable_console: false

mail:
  host: "smtp.your-domain.com"
  port: 465
  username: "noreply@your-domain.com"
  password: "your-mail-password"
  from: "noreply@your-domain.com"
  from_name: "Template App"
  reply_to: "support@your-domain.com"
  ssl: true
  enabled: false
  template_path: "templates/mail"
  max_retries: 3
  retry_interval: 5

cors:
  enabled: true
  allowed_origins:
    - "https://yourdomain.com"
    - "https://www.yourdomain.com"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Origin"
    - "Content-Type"
    - "Authorization"
  allow_credentials: true
  max_age: 86400
  expose_headers:
    - "Content-Length"
    - "Content-Type"
