# Production config
app:
  name: "template"
  port: 8888
  mode: "release"
  defaultRootPass: "${APP_DEFAULT_ROOT_PASS}"
  timezone: "Asia/Shanghai"
  api_prefix: "/api/v1"
  static_path: "/static"
  upload_path: "uploads"
  max_upload_size: 20
  allowed_file_types:
    - "image/jpeg"
    - "image/png"
    - "image/gif"
    - "application/pdf"
    - "application/msword"
    - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"

# Database config
database:
  driver: "mysql"
  host: "110.42.111.49"
  port: 1244
  username: "template"
  password: "R3DmF2eR"
  name: "template"
  charset: "utf8mb4"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600
  slow_query_threshold: 200
  enable_logging: false
  table_prefix: ""

# JWT config
jwt:
  secret_key: "${JWT_SECRET_KEY}"
  expires_in: 24
  refresh_expires_in: 168
  issuer: "template-app"
  audience: "template-users"
  blacklist_enabled: true
  blacklist_cleanup_interval: 24

# Redis config
redis:
  enabled: true
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 20
  min_idle_conns: 10
  max_conn_age: 3600
  idle_timeout: 240
  read_timeout: 3
  write_timeout: 3
  dial_timeout: 5

# Log config
log:
  level: "info"
  path: "logs"
  filename: "app.log"
  max_size: 100
  max_backups: 30
  max_age: 30
  compress: true
  json_format: true
  show_caller: false
  show_line: false
  show_stack: false
  enable_console: false

# Mail config
mail:
  host: "smtpdm.aliyun.com"
  port: 465
  username: "nine_team@nineai.jiangly.com"
  password: "Nine98Mailer"
  from: "nine_team@nineai.jiangly.com"
  from_name: "系统通知"
  reply_to: "nine_team@nineai.jiangly.com"
  ssl: true
  enabled: true
  template_path: "templates/mail"
  max_retries: 3
  retry_interval: 5

# CORS config
cors:
  enabled: true
  allowed_origins:
    - "https://template.mmmss.com"
    - "http://template.mmmss.com"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Origin"
    - "Content-Type"
    - "Authorization"
  allow_credentials: true
  max_age: 86400
  expose_headers:
    - "Content-Length"
    - "Content-Type"
